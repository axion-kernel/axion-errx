name: Shared error library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, axion-kernel, image-builder, ccf, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/agents/check_all_gates.py
      - run: go test -race ./...
