name: HK ARM64 validation of last successful CI
on:
  push:
    branches: ["runner-validation/hk-arm64-20261105-44312920"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, axion-kernel, image-builder, hk, arm64]
    timeout-minutes: 30
    steps:
      - name: Assert HK runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = aliyun-hk-arm64-kernel-01
          test "$(uname -m)" = aarch64
          printf 'Runner: %s; source: 44312920c0b65fb1630eaa039e96842688429683\n' "$RUNNER_NAME"
      - uses: actions/checkout@v4
        with:
          ref: "44312920c0b65fb1630eaa039e96842688429683"
      - name: Assert original source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "44312920c0b65fb1630eaa039e96842688429683"
          git show -s --format='Validated source: %H %s' HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/agents/check_all_gates.py
      - run: go test -race ./...

